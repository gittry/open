<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Bimbel Ceria</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f7f6;
  --card: #ffffff;
  --ink: #1e1e2d;
  --mut: #8b8ea1;
  --p: #6c5ce7;
  --p-hover: #5a4bcf;
  --p2: #fdcb6e;
  --b: #00cec9;
  --g: #00b894;
  --r: #ff7675;
  --line: #e2e5ec;
  --sh: 0 10px 25px rgba(30, 30, 45, 0.05);
  --sh-hover: 0 15px 35px rgba(30, 30, 45, 0.1);
  --rad: 20px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Nunito', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  background-image: 
    radial-gradient(circle at 0% 0%, #e0c3fc 0, transparent 40%), 
    radial-gradient(circle at 100% 100%, #8ec5fc 0, transparent 40%);
  background-attachment: fixed;
  min-height: 100vh;
}
h1, h2, .brand { font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.btn {
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  font-weight: 800;
  cursor: pointer;
  background: var(--p);
  color: #fff;
  box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:hover { background: var(--p-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.alt { background: var(--b); box-shadow: 0 4px 15px rgba(0, 206, 201, 0.3); }
.btn.alt:hover { background: #00b3a9; }
.btn.gray { background: #f1f2f6; color: var(--ink); box-shadow: none; }
.btn.gray:hover { background: #e4e5ec; }
.btn.red { background: var(--r); box-shadow: 0 4px 15px rgba(255, 118, 117, 0.3); }
.btn.red:hover { background: #e86362; }
.btn.sm { padding: 8px 14px; font-size: 0.85rem; border-radius: 10px; }
.hidden { display: none !important; }
.box {
  background: var(--card);
  border-radius: var(--rad);
  padding: 30px;
  box-shadow: var(--sh);
  border: 1px solid rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  transition: box-shadow 0.3s ease;
}
.box:hover { box-shadow: var(--sh-hover); }
#auth { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
#auth .box { width: 100%; max-width: 420px; }
#auth h1 { font-size: 2.2rem; text-align: center; color: var(--p); }
#auth p { text-align: center; color: var(--mut); margin: 5px 0 24px; font-weight: 600; }
label { display: block; font-weight: 800; font-size: 0.9rem; margin: 16px 0 6px; color: var(--ink); }
input, select, textarea {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #f8f9fa;
  outline: 0;
  transition: all 0.2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--p); background: #fff; box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1); }
textarea { min-height: 90px; resize: vertical; }
.err { color: var(--r); font-weight: 800; min-height: 1.2em; margin-top: 12px; text-align: center; font-size: 0.9rem; }
header { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; padding: 20px 30px; margin-bottom: 20px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { font-size: 1.8rem; color: var(--p); font-weight: 800; letter-spacing: -0.5px; }
.who { display: flex; gap: 15px; align-items: center; font-weight: 800; flex-wrap: wrap; }
.badge { font-size: 0.75rem; padding: 4px 12px; border-radius: 99px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
.badge.no { background: #ffeaa7; color: #d35400; }
.badge.ok { background: #55efc4; color: #00b894; }
.badge.fb { background: #ffeaa7; color: #d35400; }
main { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px; }
.tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.tab {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 99px;
  padding: 10px 20px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--mut);
}
.tab:hover { border-color: var(--p2); color: var(--ink); }
.tab.on { background: var(--p2); border-color: var(--p2); color: #2d3436; box-shadow: 0 4px 10px rgba(253, 203, 110, 0.3); }
.bar { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.bar h2 { font-size: 1.5rem; color: var(--ink); }
.bar input { max-width: 300px; border-radius: 99px; padding-left: 20px; }
.wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
table { border-collapse: collapse; width: 100%; min-width: 700px; background: #fff; text-align: left; }
th { background: #f8f9fa; color: var(--mut); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; padding: 16px; font-weight: 800; border-bottom: 2px solid var(--line); }
td { padding: 16px; border-bottom: 1px solid var(--line); font-size: 0.95rem; vertical-align: middle; color: var(--ink); }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: #fbfbfc; }
td.act { white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.empty { text-align: center; color: var(--mut); padding: 40px; font-weight: 600; font-size: 1.1rem; }
.ov { position: fixed; inset: 0; background: rgba(30, 30, 45, 0.6); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; z-index: 50; }
.ov .box { width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
.ov .row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 25px; }
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 24px; border-radius: 99px; font-weight: 800; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes pop { 0% { transform: translate(-50%, 20px) scale(0.9); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
</style>
</head>
<body>

<div id="auth">
  <div class="box">
    <h1>🎒 Bimbel Ceria</h1>
    <p id="authSub">Masuk ke Panel Admin</p>
    <form id="authForm" autocomplete="off">
      <div id="setupOnly" class="hidden">
        <label>Email Admin</label><input id="a_email" type="email">
        <label>No. WhatsApp</label><input id="a_hp" type="tel">
      </div>
      <label>Nama Pengguna</label><input id="a_nama" placeholder="Masukkan nama..." required>
      <label>Kata Sandi</label><input id="a_pass" type="password" placeholder="••••••••" required>
      <div class="err" id="authErr"></div>
      <button class="btn" style="width:100%;margin-top:16px;font-size:1.1rem" id="authBtn">Masuk Aplikasi</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">🎒 Bimbel Ceria</div>
    <div class="who">
      <span id="modeBadge" class="badge fb">🔥 Firebase</span>
      <span id="meName"></span>
      <button class="btn sm gray" id="logout">Keluar</button>
    </div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div class="box">
      <div class="bar">
        <h2 id="tabTitle"></h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <input id="q" placeholder="🔍 Cari data...">
          <button class="btn alt" id="addBtn">+ Tambah Data</button>
        </div>
      </div>
      <div class="wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div id="modal" class="ov hidden"></div>
<div id="toast" class="hidden"></div>

<script type="module">
/* =======================================================================
   ⚙️  KONFIGURASI FIREBASE (MODULAR SDK)
   ======================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set, remove, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXXnEyXgnzZqrBiTOkW47kAuV7MyzQ4EM",
  authDomain: "nodemcu-91530.firebaseapp.com",
  databaseURL: "https://nodemcu-91530-default-rtdb.firebaseio.com",
  projectId: "nodemcu-91530",
  storageBucket: "nodemcu-91530.appspot.com",
  messagingSenderId: "113192658909",
  appId: "1:113192658909:web:ed5ae18fa4d708faa2f834"
};

const GOOGLE_CLIENT_ID = "113192658909-jcurln3aqrco5ll8lvjej897673u0aop.apps.googleusercontent.com";

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
/* ======================================================================= */

const ROOT = "bimbel_jadwal";
const HARI = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp " + Number(n || 0).toLocaleString("id-ID");
const nowLocal = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString();

const SCHEMA = {
  users: { label: "Pengguna", icon: "🧑‍🎓", pk: "user_id", prefix: "U", fields: [
    { k: "nama", l: "Nama Lengkap", t: "text", req: 1 },
    { k: "email", l: "Email", t: "email", req: 1 },
    { k: "no_hp", l: "No. WhatsApp", t: "tel", req: 1 },
    { k: "role", l: "Role", t: "select", opts: () => [["siswa","Siswa"],["admin","Admin"]], req: 1 },
    { k: "tanggal_daftar", l: "Tanggal Daftar", t: "date", req: 1 },
    { k: "_pass", l: "Password", t: "password" }
  ]},
  paket: { label: "Paket Kelas", icon: "📦", pk: "paket_id", prefix: "P", fields: [
    { k: "nama_paket", l: "Nama Paket", t: "text", req: 1 },
    { k: "deskripsi", l: "Deskripsi", t: "textarea" },
    { k: "harga", l: "Harga (Rp)", t: "number", req: 1 },
    { k: "durasi_bulan", l: "Durasi (bulan)", t: "number", req: 1 },
    { k: "status_aktif", l: "Status", t: "select", opts: () => [["true","Aktif"],["false","Nonaktif"]], req: 1 }
  ]},
  jadwal: { label: "Jadwal Kelas", icon: "📅", pk: "jadwal_id", prefix: "J", fields: [
    { k: "paket_id", l: "Paket", t: "select", ref: "paket", req: 1 },
    { k: "mata_pelajaran", l: "Mata Pelajaran", t: "text", req: 1 },
    { k: "pengajar", l: "Pengajar", t: "text", req: 1 },
    { k: "hari", l: "Hari", t: "select", opts: () => HARI.map(h => [h, h]), req: 1 },
    { k: "jam_mulai", l: "Jam Mulai", t: "time", req: 1 },
    { k: "jam_selesai", l: "Jam Selesai", t: "time", req: 1 },
    { k: "tipe_kelas", l: "Tipe Kelas", t: "select", opts: () => [["online","Online"],["offline","Offline"]], req: 1 },
    { k: "lokasi_atau_link", l: "Lokasi / Link G-Meet", t: "text", req: 1 }
  ]},
  daftar: { label: "Pendaftaran", icon: "🧾", pk: "daftar_id", prefix: "D", fields: [
    { k: "user_id", l: "Siswa", t: "select", ref: "users", req: 1 },
    { k: "paket_id", l: "Paket", t: "select", ref: "paket", req: 1 },
    { k: "status_pembayaran", l: "Status Pembayaran", t: "select", opts: () => [["pending","Tertunda"],["lunas","Lunas"],["batal","Batal"]], req: 1 },
    { k: "tanggal_pembelian", l: "Tanggal Pembelian", t: "datetime-local", req: 1 }
  ]}
};

const REFLABEL = { users: "nama", paket: "nama_paket" };
let cache = { users: {}, paket: {}, jadwal: {}, daftar: {} };
let me = null, tab = "users";
let toastTimer;

/* ---------- Firebase Database Operations ---------- */
async function loadAll() {
  const dbRef = ref(db);
  try {
    const snapshot = await get(child(dbRef, ROOT));
    if (snapshot.exists()) {
      const data = snapshot.val();
      for (const col of Object.keys(cache)) {
        cache[col] = data[col] || {};
      }
    }
  } catch (error) {
    console.error("Firebase Read Error:", error);
    toast("Gagal memuat data dari Firebase!");
  }
}

async function dbPut(col, id, obj) {
  try {
    await set(ref(db, `${ROOT}/${col}/${id}`), obj);
    cache[col][id] = obj;
  } catch (error) {
    throw new Error("Gagal menyimpan ke Firebase Database");
  }
}

async function dbDel(col, id) {
  try {
    await remove(ref(db, `${ROOT}/${col}/${id}`));
    delete cache[col][id];
  } catch (error) {
    throw new Error("Gagal menghapus dari Firebase Database");
  }
}

/* ---------- Utilities ---------- */
async function hash(s) {
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) { 
    let h = 5381; 
    for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; 
    return "x" + h; 
  }
}
const newId = p => p + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 4).toUpperCase();

function toast(m) { 
  const t = $("toast"); 
  t.textContent = m; 
  t.classList.remove("hidden"); 
  clearTimeout(toastTimer); 
  toastTimer = setTimeout(() => t.classList.add("hidden"), 3000); 
}

const refName = (col, id) => { const o = cache[col][id]; return o ? o[REFLABEL[col]] : "(Data Dihapus)"; };

function options(f) {
  if (f.ref) return Object.values(cache[f.ref]).map(o => [o[SCHEMA[f.ref].pk], o[REFLABEL[f.ref]]]);
  return f.opts();
}

/* ---------- Authentication ---------- */
async function initAuth() {
  await loadAll();
  const uid = sessionStorage.getItem("uid");
  
  if (uid && cache.users[uid] && cache.users[uid].role === "admin") { 
    me = cache.users[uid]; 
    return showApp(); 
  }
  
  const first = Object.keys(cache.users).length === 0;
  $("setupOnly").classList.toggle("hidden", !first);
  $("authSub").textContent = first ? "Registrasi Admin Pertama" : "Masuk ke Panel Admin";
  $("authBtn").textContent = first ? "Buat Admin & Masuk" : "Masuk Aplikasi";
  $("auth").classList.remove("hidden");
  $("authForm").dataset.first = first ? "1" : "";
}

$("authForm").onsubmit = async e => {
  e.preventDefault();
  const nama = $("a_nama").value.trim();
  const pass = $("a_pass").value;
  const err = $("authErr");
  
  err.textContent = "";
  $("authBtn").textContent = "Memproses...";
  
  try {
    if (e.target.dataset.first) {
      const id = newId("U");
      const u = { 
        user_id: id, 
        nama, 
        email: $("a_email").value.trim(), 
        no_hp: $("a_hp").value.trim(), 
        role: "admin", 
        tanggal_daftar: nowLocal().slice(0, 10), 
        pass: await hash(id + ":" + pass) 
      };
      await dbPut("users", id, u); 
      me = u;
    } else {
      const key = nama.toLowerCase();
      const u = Object.values(cache.users).find(x => x.nama.toLowerCase() === key || (x.email || "").toLowerCase() === key);
      
      if (!u || u.pass !== await hash(u.user_id + ":" + pass)) {
        $("authBtn").textContent = "Masuk Aplikasi";
        return err.textContent = "Nama pengguna atau kata sandi salah";
      }
      if (u.role !== "admin") {
        $("authBtn").textContent = "Masuk Aplikasi";
        return err.textContent = "Akses ditolak: Hanya untuk Admin";
      }
      me = u;
    }
    sessionStorage.setItem("uid", me.user_id);
    showApp();
  } catch (x) { 
    err.textContent = x.message; 
    $("authBtn").textContent = e.target.dataset.first ? "Buat Admin & Masuk" : "Masuk Aplikasi";
  }
};

$("logout").onclick = () => { 
  sessionStorage.removeItem("uid"); 
  location.reload(); 
};

/* ---------- Dashboard App ---------- */
function showApp() {
  $("auth").classList.add("hidden"); 
  $("app").classList.remove("hidden");
  $("meName").textContent = "👋 Hai, " + me.nama;
  
  $("tabs").innerHTML = Object.entries(SCHEMA).map(([k, s]) => 
    `<button class="tab" data-t="${k}">${s.icon} ${s.label}</button>`
  ).join("");
  
  $("tabs").onclick = e => { 
    const t = e.target.closest(".tab"); 
    if (t) { 
      tab = t.dataset.t; 
      $("q").value = ""; 
      render(); 
    } 
  };
  render();
}

function cell(f, v) {
  if (f.ref) return esc(refName(f.ref, v));
  if (f.k === "harga") return `<strong>${rupiah(v)}</strong>`;
  if (f.k === "status_aktif") return v ? '<span class="badge ok">Aktif</span>' : '<span class="badge no">Nonaktif</span>';
  if (f.k === "status_pembayaran") return `<span class="badge ${v === "lunas" ? "ok" : v === "batal" ? "no" : "fb"}">${esc(v)}</span>`;
  if (f.k === "role") return `<span class="badge ${v === "admin" ? "" : "ok"}">${esc(v)}</span>`;
  if (f.t === "datetime-local") return esc(String(v || "").replace("T", " "));
  if (f.k === "deskripsi") return esc(String(v || "").slice(0, 50)) + (String(v || "").length > 50 ? "…" : "");
  return esc(v);
}

function render() {
  const s = SCHEMA[tab];
  const cols = s.fields.filter(f => f.t !== "password");
  
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  $("tabTitle").textContent = s.icon + " Manajemen " + s.label;
  $("thead").innerHTML = "<tr>" + cols.map(f => `<th>${f.l}</th>`).join("") + "<th>Aksi</th></tr>";
  
  const q = $("q").value.toLowerCase();
  const rows = Object.values(cache[tab]).filter(o => 
    !q || cols.map(f => f.ref ? refName(f.ref, o[f.k]) : o[f.k]).join(" ").toLowerCase().includes(q)
  ).reverse(); // Show newest first
  
  $("tbody").innerHTML = rows.length ? rows.map(o => 
    `<tr>
      ${cols.map(f => `<td>${cell(f, o[f.k])}</td>`).join("")}
      <td class="act">
        <button class="btn sm alt" data-e="${o[s.pk]}">✏️ Edit</button>
        <button class="btn sm red" data-d="${o[s.pk]}">🗑️</button>
      </td>
    </tr>`
  ).join("") : `<tr><td class="empty" colspan="${cols.length + 1}">Belum ada data tersedia 🍃</td></tr>`;
}

$("q").oninput = render;
$("addBtn").onclick = () => openForm();

$("tbody").onclick = e => {
  const b = e.target.closest("button"); 
  if (!b) return;
  if (b.dataset.e) openForm(b.dataset.e); 
  else if (b.dataset.d) removeData(b.dataset.d);
};

/* ---------- Form Handle (Add/Edit) ---------- */
window.closeModal = () => $("modal").classList.add("hidden");

function openForm(id) {
  const s = SCHEMA[tab];
  const o = id ? cache[tab][id] : null;
  
  const html = s.fields.map(f => {
    let v = o ? o[f.k] : "";
    if (!o) {
      if (f.k === "tanggal_daftar") v = nowLocal().slice(0, 10);
      if (f.k === "tanggal_pembelian") v = nowLocal().slice(0, 16);
    }
    if (f.k === "status_aktif") v = String(o ? o[f.k] : true);
    
    let inp;
    if (f.t === "select") {
      const ops = options(f);
      inp = `<select id="f_${f.k}">
        ${ops.length ? "" : '<option value="">(Isi data master terlebih dahulu)</option>'}
        ${ops.map(([a, b]) => `<option value="${esc(a)}" ${String(v) === String(a) ? "selected" : ""}>${esc(b)}</option>`).join("")}
      </select>`;
    } else if (f.t === "textarea") {
      inp = `<textarea id="f_${f.k}">${esc(v)}</textarea>`;
    } else {
      inp = `<input id="f_${f.k}" type="${f.t}" value="${f.t === "password" ? "" : esc(v)}" ${f.t === "number" ? 'min="0"' : ""} ${f.t === "password" ? 'autocomplete="new-password" placeholder="' + (o ? "Kosongkan jika tidak ingin mengubah sandi" : "Wajib diisi") + '"' : ""}>`;
    }
    return `<label>${f.l}</label>${inp}`;
  }).join("");
  
  const m = $("modal");
  m.innerHTML = `
    <div class="box" style="animation: pop 0.3s ease-out">
      <h2>${id ? "Ubah" : "Tambah"} ${s.label}</h2>
      ${html}
      <div class="err" id="fErr"></div>
      <div class="row">
        <button class="btn gray" onclick="closeModal()">Batal</button>
        <button class="btn" id="saveBtn">Simpan Data</button>
      </div>
    </div>`;
  m.classList.remove("hidden");
  
  $("saveBtn").onclick = () => saveData(id);
}

const adminCount = () => Object.values(cache.users).filter(u => u.role === "admin").length;

async function saveData(id) {
  const s = SCHEMA[tab];
  const old = id ? cache[tab][id] : null;
  const err = $("fErr");
  const btn = $("saveBtn");
  
  const obj = old ? { ...old } : { [s.pk]: newId(s.prefix) };
  
  for (const f of s.fields) {
    let v = $("f_" + f.k).value.trim();
    if (f.t === "password") continue;
    if (f.req && v === "") return err.textContent = `${f.l} wajib diisi!`;
    if (f.t === "number") v = Number(v);
    if (f.k === "status_aktif") v = v === "true";
    obj[f.k] = v;
  }
  
  try {
    btn.textContent = "Menyimpan...";
    btn.disabled = true;
    
    if (tab === "users") {
      const pw = $("f__pass").value;
      if (!old && !pw) throw new Error("Password wajib diisi!");
      if (Object.values(cache.users).some(u => u.user_id !== obj.user_id && u.nama.toLowerCase() === obj.nama.toLowerCase())) {
        throw new Error("Nama pengguna sudah digunakan!");
      }
      if (old && old.role === "admin" && obj.role !== "admin" && adminCount() <= 1) {
        throw new Error("Sistem minimal harus memiliki 1 admin!");
      }
      if (pw) obj.pass = await hash(obj.user_id + ":" + pw);
    }
    
    if (tab === "jadwal" && obj.jam_selesai <= obj.jam_mulai) {
      throw new Error("Jam selesai harus lebih besar dari jam mulai!");
    }
    
    await dbPut(tab, obj[s.pk], obj);
    
    if (tab === "users" && obj.user_id === me.user_id) { 
      me = obj; 
      $("meName").textContent = "👋 Hai, " + me.nama; 
    }
    
    window.closeModal(); 
    render(); 
    toast("Data berhasil disimpan ✅");
  } catch (x) { 
    err.textContent = x.message; 
    btn.textContent = "Simpan Data";
    btn.disabled = false;
  }
}

/* ---------- Hapus Data ---------- */
async function removeData(id) {
  const o = cache[tab][id];
  
  if (tab === "users") {
    if (id === me.user_id) return toast("⚠️ Anda tidak bisa menghapus akun sendiri!");
    if (o.role === "admin" && adminCount() <= 1) return toast("⚠️ Minimal harus tersisa 1 admin!");
    if (Object.values(cache.daftar).some(d => d.user_id === id)) return toast("⚠️ Pengguna ini masih memiliki riwayat pendaftaran!");
  }
  if (tab === "paket" && (Object.values(cache.jadwal).some(j => j.paket_id === id) || Object.values(cache.daftar).some(d => d.paket_id === id))) {
    return toast("⚠️ Paket ini sedang digunakan di Jadwal atau Pendaftaran!");
  }
  
  if (!confirm("Apakah Anda yakin ingin menghapus data ini secara permanen?")) return;
  
  try { 
    await dbDel(tab, id); 
    render(); 
    toast("Data berhasil dihapus 🗑️"); 
  } catch (x) { 
    toast(x.message); 
  }
}

// Mulai Aplikasi
initAuth();
</script>
