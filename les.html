<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Bimbel Ceria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8fafc;
            /* Background pattern yang fun tapi minimalis */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(253, 203, 110, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(108, 92, 231, 0.1) 0%, transparent 20%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Baloo 2', cursive;
        }

        /* Animasi Card Hover */
        .portal-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center bottom;
        }
        .portal-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        /* Modal Overlay */
        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
        }

        /* Custom Scrollbar untuk Modal */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex items-center justify-center py-10 px-4">

    <!-- CONTAINER UTAMA -->
    <div class="w-full max-w-5xl">
        
        <!-- HEADER -->
        <div class="text-center mb-12">
            <div class="inline-block bg-white px-6 py-2 rounded-full shadow-sm text-sm font-bold text-blue-600 mb-4 tracking-wider uppercase border border-blue-50">
                Portal Utama Sistem
            </div>
            <h1 class="text-5xl md:text-6xl font-extrabold text-slate-800 tracking-tight mb-3">
                BIMBEL <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">CERIA</span>
            </h1>
            <p class="text-slate-500 font-semibold text-lg max-w-2xl mx-auto">
                Pilih menu di bawah ini untuk mengakses fitur akademik, absensi, hingga administrasi sistem.
            </p>
        </div>

        <!-- GRID MENU BOXES -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <!-- TAB 1: INFORMASI -->
            <button onclick="openInfoModal()" class="portal-card bg-white rounded-3xl p-8 text-left border border-slate-100 shadow-xl shadow-slate-200/50 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-yellow-100 to-orange-50 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                <div class="w-16 h-16 bg-gradient-to-br from-yellow-400 to-orange-400 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-orange-400/30 mb-6 text-white">
                    📚
                </div>
                <h3 class="text-2xl font-bold text-slate-800 mb-2">Informasi</h3>
                <p class="text-slate-500 font-semibold text-sm leading-relaxed">Lihat daftar program & paket kelas yang tersedia.</p>
            </button>

            <!-- TAB 2: CEK KELAS -->
            <button onclick="window.location.href='kelas.html'" class="portal-card bg-white rounded-3xl p-8 text-left border border-slate-100 shadow-xl shadow-slate-200/50 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-green-100 to-emerald-50 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-emerald-400 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-green-400/30 mb-6 text-white">
                    🏫
                </div>
                <h3 class="text-2xl font-bold text-slate-800 mb-2">Cek Kelas</h3>
                <p class="text-slate-500 font-semibold text-sm leading-relaxed">Jadwal pelajaran, materi, dan kelas online (G-Meet).</p>
            </button>

            <!-- TAB 3: ABSENSI -->
            <button onclick="window.location.href='absen.html'" class="portal-card bg-white rounded-3xl p-8 text-left border border-slate-100 shadow-xl shadow-slate-200/50 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-blue-100 to-cyan-50 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-blue-500/30 mb-6 text-white">
                    ✋
                </div>
                <h3 class="text-2xl font-bold text-slate-800 mb-2">Absensi</h3>
                <p class="text-slate-500 font-semibold text-sm leading-relaxed">Sistem swipe kehadiran untuk Admin dan rekap Siswa.</p>
            </button>

            <!-- TAB 4: ADMIN -->
            <button onclick="window.location.href='bimbel.html'" class="portal-card bg-white rounded-3xl p-8 text-left border border-slate-100 shadow-xl shadow-slate-200/50 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-purple-100 to-pink-50 rounded-bl-full -z-10 transition-transform group-hover:scale-110"></div>
                <div class="w-16 h-16 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-purple-500/30 mb-6 text-white">
                    ⚙️
                </div>
                <h3 class="text-2xl font-bold text-slate-800 mb-2">Admin</h3>
                <p class="text-slate-500 font-semibold text-sm leading-relaxed">Panel master data, kelola user, kelas, dan jadwal.</p>
            </button>

        </div>
    </div>

    <!-- MODAL INFORMASI KELAS (Hidden by default) -->
    <div id="info-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-2xl rounded-[32px] shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300" id="modal-content">
            
            <!-- Modal Header -->
            <div class="bg-gradient-to-r from-orange-400 to-yellow-400 p-6 flex justify-between items-center text-white relative overflow-hidden">
                <div class="absolute -right-10 -top-10 opacity-20 text-9xl">📚</div>
                <h2 class="text-2xl font-bold relative z-10">Informasi Paket Kelas</h2>
                <button onclick="closeInfoModal()" class="relative z-10 w-10 h-10 bg-white/20 hover:bg-white/40 rounded-full flex items-center justify-center transition backdrop-blur-sm">
                    ✕
                </button>
            </div>

            <!-- Modal Body (List Data) -->
            <div class="p-6 max-h-[60vh] overflow-y-auto bg-slate-50">
                <div id="loading-state" class="text-center py-10">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-orange-500 mx-auto mb-4"></div>
                    <p class="text-slate-500 font-bold">Mengambil data dari Firebase...</p>
                </div>
                
                <!-- Container untuk List Paket Kelas -->
                <div id="paket-list" class="flex flex-col gap-4 hidden">
                    <!-- Data dari Firebase akan di-render ke sini -->
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT: FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDXXnEyXgnzZqrBiTOkW47kAuV7MyzQ4EM",
            authDomain: "nodemcu-91530.firebaseapp.com",
            databaseURL: "https://nodemcu-91530-default-rtdb.firebaseio.com",
            projectId: "nodemcu-91530",
            storageBucket: "nodemcu-91530.appspot.com",
            messagingSenderId: "113192658909",
            appId: "1:113192658909:web:ed5ae18fa4d708faa2f834"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Formatter Rupiah
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        // Fetch Data Firebase
        async function fetchPaketKelas() {
            const listContainer = document.getElementById('paket-list');
            const loadingState = document.getElementById('loading-state');
            
            try {
                const dbRef = ref(db);
                // Mengambil node paket dari ROOT bimbel_jadwal
                const snapshot = await get(child(dbRef, 'bimbel_jadwal/paket'));
                
                loadingState.classList.add('hidden');
                listContainer.classList.remove('hidden');
                listContainer.innerHTML = '';

                if (snapshot.exists()) {
                    const dataPaket = snapshot.val();
                    
                    // Filter hanya paket yang statusnya aktif (jika ada flag status_aktif)
                    const paketAktif = Object.values(dataPaket).filter(p => p.status_aktif === true || p.status_aktif === "true");

                    if(paketAktif.length === 0) {
                        listContainer.innerHTML = `<p class="text-center text-slate-500 py-6">Belum ada paket kelas yang aktif.</p>`;
                        return;
                    }

                    // Render ke HTML
                    paketAktif.forEach(paket => {
                        const card = `
                            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm hover:shadow-md transition">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold text-slate-800 brand-font">${paket.nama_paket}</h3>
                                    <span class="bg-green-100 text-green-700 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wide">
                                        ${paket.durasi_bulan} Bulan
                                    </span>
                                </div>
                                <p class="text-slate-500 text-sm mb-4 leading-relaxed">${paket.deskripsi || 'Tidak ada deskripsi.'}</p>
                                <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                                    <span class="text-xs font-bold text-slate-400 uppercase">Investasi Pendidikan</span>
                                    <span class="text-lg font-black text-orange-500">${formatRupiah(paket.harga)}</span>
                                </div>
                            </div>
                        `;
                        listContainer.innerHTML += card;
                    });
                } else {
                    listContainer.innerHTML = `<p class="text-center text-slate-500 py-6">Belum ada data paket kelas di sistem.</p>`;
                }
            } catch (error) {
                loadingState.classList.add('hidden');
                listContainer.classList.remove('hidden');
                listContainer.innerHTML = `<div class="bg-red-50 text-red-500 p-4 rounded-xl text-center font-semibold">Gagal mengambil data dari Firebase. Pastikan koneksi internet stabil.</div>`;
                console.error("Firebase Error: ", error);
            }
        }

        // Global functions untuk UI agar bisa dipanggil dari onclick
        window.openInfoModal = () => {
            const modal = document.getElementById('info-modal');
            const content = document.getElementById('modal-content');
            
            modal.classList.remove('hidden');
            // Sedikit delay untuk trigger animasi tailwind
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);

            // Fetch ulang data ketika dibuka untuk mendapatkan data real-time
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('paket-list').classList.add('hidden');
            fetchPaketKelas();
        };

        window.closeInfoModal = () => {
            const modal = document.getElementById('info-modal');
            const content = document.getElementById('modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // Sesuaikan dengan durasi transisi Tailwind (300ms)
        };
    </script>
</body>
</html>
