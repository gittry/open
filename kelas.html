<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bimbel Ceria</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --p: #6c5ce7;
  --p2: #5a4bcf;
  --bg: #f4f7f6;
  --soft: #e0c3fc;
  --ink: #1e1e2d;
  --mut: #8b8ea1;
  --line: #e2e5ec;
  --ok: #00b894;
  --warn: #fdcb6e;
  --card: #ffffff;
  --sh: 0 10px 25px rgba(30, 30, 45, 0.05);
  --sh-hover: 0 15px 35px rgba(30, 30, 45, 0.1);
  --rad: 20px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Nunito', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  background-image: 
    radial-gradient(circle at 0% 0%, #e0c3fc 0, transparent 40%), 
    radial-gradient(circle at 100% 100%, #8ec5fc 0, transparent 40%);
  background-attachment: fixed;
  min-height: 100vh;
}
h1, h2, h3, .brand { font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; margin: 0; }
button, input, select { font: inherit; }
.hidden { display: none !important; }
.in { animation: in .35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes in { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: none; } }

.card {
  background: var(--card);
  border-radius: var(--rad);
  padding: 25px;
  box-shadow: var(--sh);
  border: 1px solid rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  transition: box-shadow 0.3s ease;
}
.card:hover { box-shadow: var(--sh-hover); }

.btn {
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  font-weight: 800;
  cursor: pointer;
  background: var(--p);
  color: #fff;
  transition: all 0.2s ease;
  box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
}
.btn:hover:not(:disabled) { background: var(--p2); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: 0.7; cursor: not-allowed; box-shadow: none; }
.btn.ghost { background: var(--soft); color: var(--p); box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: #d0aef5; }
.btn.full { width: 100%; }

label { display: block; font-weight: 800; font-size: 0.9rem; margin: 16px 0 6px; color: var(--ink); }
input, select {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #f8f9fa;
  outline: 0;
  transition: all 0.2s;
}
input:focus, select:focus { border-color: var(--p); background: #fff; box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1); }

/* Login Section */
#login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
#login .card { width: 100%; max-width: 420px; text-align: center; }
#login h1 { margin: 10px 0 5px; color: var(--p); font-size: 2.2rem; letter-spacing: -0.5px; }
#login p { color: var(--mut); margin: 0 0 15px; font-weight: 600; }
.sep { color: var(--mut); font-size: 0.85rem; margin: 20px 0 10px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
.sep:before, .sep:after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }
.stack { display: grid; gap: 12px; margin-top: 15px; }
#login label { text-align: left; }

/* Header & Layout */
header {
  background: rgba(255, 255, 255, 0.8);
  border-bottom: 1px solid var(--line);
  padding: 16px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
}
.brand { font-weight: 800; color: var(--p); font-size: 1.5rem; letter-spacing: -0.5px; }
.who { display: flex; align-items: center; gap: 15px; font-weight: 800; }
main { max-width: 1000px; margin: 0 auto; padding: 25px 20px 50px; }

/* Tabs */
.tabs {
  display: flex;
  gap: 8px;
  background: rgba(255,255,255,0.7);
  padding: 8px;
  border-radius: 16px;
  border: 1px solid var(--line);
  margin-bottom: 25px;
  width: fit-content;
  max-width: 100%;
  overflow-x: auto;
  backdrop-filter: blur(5px);
}
.tab {
  border: 0;
  background: transparent;
  padding: 12px 20px;
  border-radius: 12px;
  font-weight: 800;
  color: var(--mut);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab:hover:not(.on) { color: var(--ink); background: rgba(255,255,255,0.5); }
.tab.on { background: var(--p); color: #fff; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3); }

/* Calendar */
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.cal-head h2 { margin: 0; font-size: 1.3rem; text-transform: capitalize; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.dow { text-align: center; font-size: 0.8rem; font-weight: 800; color: var(--mut); padding: 5px 0; text-transform: uppercase; letter-spacing: 1px; }
.day {
  aspect-ratio: 1;
  border: 2px solid transparent;
  border-radius: 14px;
  background: #f8f9fa;
  cursor: pointer;
  font-weight: 800;
  position: relative;
  padding: 0;
  color: var(--ink);
  transition: all 0.2s;
  font-size: 1rem;
}
.day:hover:not(.blank) { border-color: var(--p); background: #fff; transform: scale(1.05); }
.day.has { background: var(--soft); color: var(--p2); }
.day.has:after {
  content: "";
  position: absolute;
  bottom: 8px;
  left: 50%;
  width: 6px;
  height: 6px;
  margin-left: -3px;
  border-radius: 50%;
  background: var(--p);
}
.day.today { box-shadow: inset 0 0 0 2px var(--warn); }
.day.sel { background: var(--p); color: #fff; border-color: var(--p); transform: scale(1.05); box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3); }
.day.sel:after { background: #fff; }
.day.blank { visibility: hidden; }

/* Details */
.detail { margin-top: 25px; }
.detail h3 { margin: 0 0 15px; font-size: 1.2rem; color: var(--ink); border-bottom: 2px solid var(--line); padding-bottom: 10px; }
.cls {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding: 16px;
  border-radius: 16px;
  background: #fff;
  margin-top: 10px;
  border-left: 5px solid var(--p);
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  transition: transform 0.2s;
}
.cls:hover { transform: translateX(5px); }
.cls .t { font-weight: 800; color: var(--p); min-width: 110px; font-size: 0.95rem; }
.cls b { font-size: 1.1rem; color: var(--ink); display: block; margin-bottom: 4px; }
.cls small { display: block; color: var(--mut); font-size: 0.9rem; font-weight: 600; line-height: 1.4; }
.cls a { color: var(--p); word-break: break-all; text-decoration: none; }
.cls a:hover { text-decoration: underline; }

/* List View */
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.item { border-top: 5px solid var(--p); padding: 20px; }
.item .hari { font-size: 0.8rem; font-weight: 800; color: var(--p); background: var(--soft); display: inline-block; padding: 4px 12px; border-radius: 99px; letter-spacing: 0.5px; text-transform: uppercase; }
.item h3 { margin: 12px 0 8px; font-size: 1.2rem; }
.item p { margin: 4px 0; color: var(--mut); font-size: 0.95rem; font-weight: 600; }

.empty { text-align: center; color: var(--mut); padding: 30px; font-weight: 600; font-size: 1.1rem; }
.row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: end; }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr; }
  .cls { flex-direction: column; gap: 8px; }
  .day { border-radius: 10px; font-size: 0.9rem; }
  .cal-head h2 { font-size: 1.1rem; }
}

/* Admin Table */
.wrap { overflow-x: auto; margin-top: 10px; border-radius: 12px; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; background: #fff; }
th { background: #f8f9fa; color: var(--mut); text-align: left; font-size: 0.8rem; padding: 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--line); }
td { padding: 14px; border-bottom: 1px solid var(--line); font-size: 0.95rem; font-weight: 600; }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: #fbfbfc; }
h2.sec { margin: 30px 0 10px; font-size: 1.3rem; color: var(--ink); }

/* Badges & Toast */
.badge { font-size: 0.75rem; font-weight: 800; padding: 4px 12px; border-radius: 99px; background: #55efc4; color: #00b894; letter-spacing: 0.5px; text-transform: uppercase; }
.badge.no { background: #ffeaa7; color: #d35400; }
.badge.fb { background: #ffeaa7; color: #d35400; }
#login .badge { display: inline-block; margin-bottom: 10px; }

#toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translate(-50%, 30px) scale(0.9);
  background: var(--ink);
  color: #fff;
  padding: 14px 26px;
  border-radius: 99px;
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 100;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#toast.ok { background: var(--ok); }
#toast.err { background: #ff7675; }
</style>
</head>
<body>

<section id="login">
  <div class="card in">
    <div style="font-size:3rem; margin-bottom: 10px;">🎒</div>
    <h1>Bimbel Ceria</h1>
    <p>Belajar jadi lebih seru dan mudah!</p>
    <span class="mode badge fb" id="loginBadge">🔥 Firebase Ready</span>
    
    <div id="vLogin">
      <label>Nama Lengkap / Username</label>
      <input id="inNama" placeholder="Masukkan nama..." autocomplete="username">
      <label>Kata Sandi</label>
      <input id="inPass" type="password" placeholder="••••••••" autocomplete="current-password">
      <div class="stack">
        <button class="btn full" id="btnSiswa" disabled>Masuk sebagai Siswa</button>
        <button class="btn ghost full" id="btnAdmin" disabled>Masuk sebagai Admin</button>
      </div>
      <div class="sep">Belum memiliki akun?</div>
      <button class="btn ghost full" id="toReg">Buat Akun Baru</button>
    </div>
    
    <div id="vReg" class="hidden">
      <p id="regHint" style="margin-top:14px; font-size: 0.9rem; color: var(--p);"></p>
      <label>Nama Lengkap</label>
      <input id="rNama" placeholder="Nama sesuai KTP/Rapor">
      <label>Email</label>
      <input id="rEmail" type="email" placeholder="contoh@email.com">
      <label>No. WhatsApp</label>
      <input id="rHp" type="tel" placeholder="08123456789">
      <label>Kata Sandi</label>
      <input id="rPass" type="password" placeholder="Buat sandi yang kuat" autocomplete="new-password">
      <div class="stack">
        <button class="btn full" id="btnDaftar">Daftar Sekarang</button>
        <button class="btn ghost full" id="toLogin">Kembali ke Login</button>
      </div>
    </div>
  </div>
</section>

<section id="student" class="hidden">
  <header>
    <div class="brand">🎒 Bimbel Ceria</div>
    <div class="who">
      <span class="mode badge fb">🔥 Firebase</span>
      <span id="sName"></span>
      <button class="btn ghost sm" data-logout>Keluar</button>
    </div>
  </header>
  <main>
    <div class="tabs" id="sTabs">
      <button class="tab on" data-p="pCal">📅 Kalender Jadwal</button>
      <button class="tab" data-p="pList">📚 Daftar Kelas Saya</button>
    </div>
    <div id="pCal" class="panel in">
      <div class="card">
        <div class="cal-head">
          <button class="btn ghost" id="prev">‹</button>
          <h2 id="calTitle"></h2>
          <button class="btn ghost" id="next">›</button>
        </div>
        <div class="grid" id="calGrid"></div>
        <div class="detail" id="detail"></div>
      </div>
    </div>
    <div id="pList" class="panel hidden">
      <div class="list" id="listBox"></div>
    </div>
  </main>
</section>

<section id="admin" class="hidden">
  <header>
    <div class="brand">🎒 Bimbel Ceria · Admin</div>
    <div class="who">
      <span class="mode badge fb">🔥 Firebase</span>
      <span id="aName">Admin</span>
      <button class="btn ghost sm" data-logout>Keluar</button>
    </div>
  </header>
  <main class="in">
    <div class="card">
      <h2 style="margin:0 0 20px">Penugasan Kelas Siswa</h2>
      <form id="form" class="row">
        <div>
          <label>Pilih Siswa</label>
          <select id="aSiswa"></select>
        </div>
        <div>
          <label>Pilih Paket Kelas</label>
          <select id="aPaket"></select>
        </div>
        <button class="btn" id="btnAssign">Simpan Penugasan</button>
      </form>
    </div>
    <h2 class="sec">Riwayat Pendaftaran & Penugasan</h2>
    <div class="card wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Siswa</th><th>Paket Kelas</th><th>Status</th></tr>
        </thead>
        <tbody id="hist"></tbody>
      </table>
    </div>
  </main>
</section>

<div id="toast"></div>

<script type="module">
/* =======================================================================
   ⚙️  KONFIGURASI FIREBASE (MODULAR SDK)
   ======================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXXnEyXgnzZqrBiTOkW47kAuV7MyzQ4EM",
  authDomain: "nodemcu-91530.firebaseapp.com",
  databaseURL: "https://nodemcu-91530-default-rtdb.firebaseio.com",
  projectId: "nodemcu-91530",
  storageBucket: "nodemcu-91530.appspot.com",
  messagingSenderId: "113192658909",
  appId: "1:113192658909:web:ed5ae18fa4d708faa2f834"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
/* ======================================================================= */

const ROOT = "bimbel_jadwal";
const $ = id => document.getElementById(id);
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const ORDER = d => (HARI.indexOf(d) + 6) % 7;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = p => p + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 4).toUpperCase();
const nowLocal = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString();
const wkt = j => `${j.jam_mulai} - ${j.jam_selesai}`;
const loc = v => { 
  const s = String(v || ""); 
  return /^(https?:\/\/|[\w-]+(\.[\w-]+)+\/)/.test(s) ? `<a href="${esc(/^https?:/.test(s) ? s : "https://" + s)}" target="_blank" rel="noopener">${esc(s)}</a>` : esc(s); 
};

let cache = { users: {}, paket: {}, jadwal: {}, daftar: {} };
let me = null, cursor = new Date(), selected = null;
cursor.setDate(1);
const list = c => Object.values(cache[c]);

/* ===== Database Firebase ===== */
async function loadAll() {
  const dbRef = ref(db);
  try {
    const snapshot = await get(child(dbRef, ROOT));
    if (snapshot.exists()) {
      const data = snapshot.val();
      for (const col of Object.keys(cache)) {
        cache[col] = data[col] || {};
      }
    }
    // Enable buttons if load succeeds
    $("btnSiswa").disabled = false;
    $("btnAdmin").disabled = false;
  } catch (error) {
    console.error("Firebase Read Error:", error);
    toast("Gagal memuat data. Cek koneksi atau rules Firebase.", "err");
  }
}

async function dbPut(col, id, obj) {
  try {
    await set(ref(db, `${ROOT}/${col}/${id}`), obj);
    cache[col][id] = obj;
  } catch (error) {
    throw new Error("Gagal menyimpan ke database");
  }
}

async function hash(s) {
  try { 
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); 
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); 
  } catch (e) { 
    let h = 5381; 
    for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; 
    return "x" + h; 
  }
}

/* ===== UI utilities ===== */
let toastTimer;
window.toast = function(msg, type = "ok") {
  const t = $("toast"); 
  t.textContent = msg; 
  t.className = "show " + type;
  clearTimeout(toastTimer); 
  toastTimer = setTimeout(() => t.className = "", 3000);
}

function go(id) {
  ["login", "student", "admin"].forEach(s => $(s).classList.add("hidden"));
  const el = $(id); 
  el.classList.remove("hidden");
  el.classList.remove("in"); 
  void el.offsetWidth; 
  el.classList.add("in");
  window.scrollTo(0, 0);
}

function view(reg) {
  ["vLogin", "vReg"].forEach(v => $(v).classList.add("hidden"));
  const el = $(reg ? "vReg" : "vLogin"); 
  el.classList.remove("hidden");
  el.classList.remove("in"); 
  void el.offsetWidth; 
  el.classList.add("in");
}

/* ===== Login / Daftar / Logout ===== */
async function loginAs(role) {
  const btn = role === 'admin' ? $("btnAdmin") : $("btnSiswa");
  const origText = btn.textContent;
  
  const key = $("inNama").value.trim().toLowerCase();
  const pass = $("inPass").value;
  
  if (!key || !pass) return toast("⚠️ Isi nama pengguna dan kata sandi", "err");
  
  btn.textContent = "Memeriksa...";
  btn.disabled = true;
  
  // Reload data to ensure we have latest users (important if multiple tabs open)
  await loadAll();
  
  const u = list("users").find(x => x.nama.toLowerCase() === key || (x.email || "").toLowerCase() === key);
  
  if (!u || u.pass !== await hash(u.user_id + ":" + pass)) {
    btn.textContent = origText;
    btn.disabled = false;
    return toast("❌ Nama pengguna atau kata sandi salah", "err");
  }
  
  if (u.role !== role) {
    btn.textContent = origText;
    btn.disabled = false;
    return toast(role === "admin" ? "⚠️ Akun ini bukan Admin" : "⚠️ Akun ini Admin, gunakan tombol 'Masuk sebagai Admin'", "err");
  }
  
  btn.textContent = origText;
  btn.disabled = false;
  start(u);
}

function start(u) { 
  sessionStorage.setItem("uid", u.user_id); 
  return u.role === "admin" ? enterAdmin(u) : enterStudent(u); 
}

async function daftar() {
  const btn = $("btnDaftar");
  const nama = $("rNama").value.trim(), email = $("rEmail").value.trim(), hp = $("rHp").value.trim(), pass = $("rPass").value;
  
  if (!nama || !email || !hp || !pass) return toast("⚠️ Lengkapi semua data pendaftaran", "err");
  
  btn.textContent = "Memproses...";
  btn.disabled = true;
  
  await loadAll(); // refresh
  
  if (list("users").some(u => u.nama.toLowerCase() === nama.toLowerCase())) {
    btn.textContent = "Daftar Sekarang";
    btn.disabled = false;
    return toast("⚠️ Nama sudah digunakan, pilih nama lain", "err");
  }
  
  const id = newId("U"), first = !list("users").length;
  const u = { 
    user_id: id, 
    nama, 
    email, 
    no_hp: hp, 
    role: first ? "admin" : "siswa", 
    tanggal_daftar: nowLocal().slice(0, 10), 
    pass: await hash(id + ":" + pass) 
  };
  
  try { 
    await dbPut("users", id, u); 
    toast(first ? "🎉 Akun Admin pertama berhasil dibuat!" : `🎉 Selamat datang, ${nama}!`);
    start(u);
  } catch (x) { 
    btn.textContent = "Daftar Sekarang";
    btn.disabled = false;
    return toast("❌ " + x.message, "err"); 
  }
}

$("btnSiswa").onclick = () => loginAs("siswa");
$("btnAdmin").onclick = () => loginAs("admin");
$("btnDaftar").onclick = daftar;
$("toReg").onclick = () => view(true);
$("toLogin").onclick = () => view(false);

document.querySelectorAll("[data-logout]").forEach(b => b.onclick = () => {
  sessionStorage.removeItem("uid"); 
  me = null;
  ["inNama", "inPass", "rNama", "rEmail", "rHp", "rPass"].forEach(i => $(i).value = "");
  view(false); 
  go("login");
});

/* ===== Student View ===== */
function myJadwal() {
  // Hanya ambil paket yang status pembayarannya lunas/pending (bukan batal)
  const ids = list("daftar").filter(d => d.user_id === me.user_id && d.status_pembayaran !== "batal").map(d => d.paket_id);
  // Cek juga apakah paket tersebut statusnya aktif
  return list("jadwal").filter(j => ids.includes(j.paket_id) && cache.paket[j.paket_id]?.status_aktif !== false);
}

async function enterStudent(u) {
  me = u; 
  try { await loadAll(); } catch (e) { toast("Gagal memuat data terbaru", "err"); }
  
  selected = new Date(); 
  cursor = new Date(); 
  cursor.setDate(1);
  
  $("sName").textContent = "👋 Hai, " + u.nama;
  switchTab("pCal"); 
  renderCal(); 
  showDetail(selected); 
  renderList(); 
  go("student");
}

function switchTab(pid) {
  document.querySelectorAll("#sTabs .tab").forEach(t => t.classList.toggle("on", t.dataset.p === pid));
  document.querySelectorAll("#student .panel").forEach(p => {
    const on = p.id === pid; 
    p.classList.toggle("hidden", !on);
    if (on) { 
      p.classList.remove("in"); 
      void p.offsetWidth; 
      p.classList.add("in"); 
    }
  });
}
$("sTabs").onclick = e => { const t = e.target.closest(".tab"); if (t) switchTab(t.dataset.p); };

const sameDay = (a, b) => a && b && a.toDateString() === b.toDateString();

function renderCal() {
  const y = cursor.getFullYear(), m = cursor.getMonth(), jd = myJadwal();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  
  $("calTitle").textContent = cursor.toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  
  let h = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"].map(d => `<div class="dow">${d}</div>`).join("");
  
  for (let i = 0; i < cursor.getDay(); i++) {
    h += '<button class="day blank" tabindex="-1"></button>';
  }
  
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const dt = new Date(y, m, d);
    const cls = jd.filter(j => j.hari === HARI[dt.getDay()]);
    // Asumsi: kelas yang lewat tetap ditandai jika ada di jadwal rutin mingguan
    const has = cls.length > 0; 
    
    const c = ["day", has ? "has" : "", sameDay(dt, today) ? "today" : "", sameDay(dt, selected) ? "sel" : ""].join(" ");
    
    h += `<button class="${c}" data-d="${d}" ${has ? `title="${esc(cls.map(j => j.mata_pelajaran + " " + wkt(j)).join(", "))}"` : ""}>${d}</button>`;
  }
  $("calGrid").innerHTML = h;
}

function showDetail(dt) {
  selected = dt;
  const cls = myJadwal().filter(j => j.hari === HARI[dt.getDay()]).sort((a, b) => a.jam_mulai.localeCompare(b.jam_mulai));
  const tgl = dt.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  
  $("detail").innerHTML = `<h3>${tgl}</h3>` + (cls.length
    ? cls.map(j => `
      <div class="cls">
        <div class="t">🕒 ${esc(wkt(j))}</div>
        <div>
          <b>${esc(j.mata_pelajaran)}</b>
          <small>👩‍🏫 ${esc(j.pengajar)} · ${j.tipe_kelas === "online" ? "💻 Online" : "📍 Offline"}</small>
          <small>🔗 ${loc(j.lokasi_atau_link)}</small>
        </div>
      </div>`).join("")
    : '<div class="empty" style="padding:14px">🌴 Tidak ada jadwal kelas di tanggal ini</div>');
    
  document.querySelectorAll(".day").forEach(b => 
    b.classList.toggle("sel", !!b.dataset.d && sameDay(new Date(cursor.getFullYear(), cursor.getMonth(), +b.dataset.d), dt))
  );
}

const pick = e => { 
  const b = e.target.closest(".day[data-d]"); 
  if (b) showDetail(new Date(cursor.getFullYear(), cursor.getMonth(), +b.dataset.d)); 
};
$("calGrid").onclick = pick;
$("calGrid").onmouseover = pick; // Optional: preview on hover

$("prev").onclick = () => { cursor.setMonth(cursor.getMonth() - 1); renderCal(); };
$("next").onclick = () => { cursor.setMonth(cursor.getMonth() + 1); renderCal(); };

function renderList() {
  const jd = myJadwal().sort((a, b) => ORDER(a.hari) - ORDER(b.hari) || a.jam_mulai.localeCompare(b.jam_mulai));
  
  $("listBox").innerHTML = jd.length ? jd.map(j => {
    const p = cache.paket[j.paket_id];
    return `
      <div class="card item">
        <span class="hari">${esc(j.hari)}</span>
        <h3>${esc(j.mata_pelajaran)}</h3>
        <p>🕒 ${esc(wkt(j))}</p>
        <p>👩‍🏫 ${esc(j.pengajar)}</p>
        <p>${j.tipe_kelas === "online" ? "💻" : "📍"} ${loc(j.lokasi_atau_link)}</p>
        <p style="margin-top:10px; font-size:0.85rem;">📦 Paket: <b>${esc(p ? p.nama_paket : "(paket dihapus)")}</b></p>
      </div>`;
  }).join("") : '<div class="card empty" style="grid-column:1/-1">Belum ada jadwal. Hubungi Admin untuk mendaftar paket kelas! 📞</div>';
}

/* ===== Admin View ===== */
async function enterAdmin(u) {
  me = u; 
  try { await loadAll(); } catch (e) { toast("Gagal memuat data terbaru", "err"); }
  
  $("aName").textContent = u.nama;
  
  const sw = list("users").filter(x => x.role === "siswa");
  const pk = list("paket").filter(p => p.status_aktif !== false);
  
  $("aSiswa").innerHTML = sw.length 
    ? sw.map(x => `<option value="${esc(x.user_id)}">${esc(x.nama)}</option>`).join("") 
    : '<option value="">(Belum ada siswa terdaftar)</option>';
    
  $("aPaket").innerHTML = pk.length 
    ? pk.map(p => `<option value="${esc(p.paket_id)}">${esc(p.nama_paket)} - Rp ${Number(p.harga||0).toLocaleString('id-ID')}</option>`).join("") 
    : '<option value="">(Belum ada paket, tambahkan di Panel Admin Master)</option>';
    
  renderHist(); 
  go("admin");
}

function renderHist() {
  const rows = list("daftar").sort((a, b) => (b.tanggal_pembelian || "").localeCompare(a.tanggal_pembelian || ""));
  
  $("hist").innerHTML = rows.length ? rows.map((d, i) => {
    const u = cache.users[d.user_id];
    const k = cache.paket[d.paket_id];
    
    let statusBadge = '';
    if(d.status_pembayaran === 'lunas') statusBadge = '<span class="badge">Lunas</span>';
    else if(d.status_pembayaran === 'batal') statusBadge = '<span class="badge no">Batal</span>';
    else statusBadge = '<span class="badge fb">Tertunda</span>';

    return `
      <tr>
        <td>${i + 1}</td>
        <td>${esc(u ? u.nama : "(Data Siswa Dihapus)")}</td>
        <td>${esc(k ? k.nama_paket : "(Data Paket Dihapus)")}</td>
        <td>${statusBadge}</td>
      </tr>`;
  }).join("") : '<tr><td colspan="4" class="empty">Belum ada riwayat pendaftaran</td></tr>';
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const uid = $("aSiswa").value, pid = $("aPaket").value;
  const u = cache.users[uid], k = cache.paket[pid];
  
  if (!u || !k) return toast("⚠️ Pilih Siswa dan Paket terlebih dahulu", "err");
  
  // Cek duplikasi (jangan daftarkan kalau sudah lunas/pending)
  if (list("daftar").some(d => d.user_id === uid && d.paket_id === pid && d.status_pembayaran !== "batal")) {
    return toast(`⚠️ ${u.nama} sudah terdaftar aktif di paket ini`, "err");
  }
  
  const id = newId("D");
  const btn = $("btnAssign"); 
  btn.disabled = true;
  btn.textContent = "Menyimpan...";
  
  try {
    await dbPut("daftar", id, { 
      daftar_id: id, 
      user_id: uid, 
      paket_id: pid, 
      status_pembayaran: "lunas", // Otomatis lunas dari sisi Admin
      tanggal_pembelian: nowLocal().slice(0, 16) 
    });
    renderHist(); 
    toast(`✅ ${u.nama} berhasil didaftarkan ke ${k.nama_paket}`);
  } catch (x) { 
    toast("❌ " + x.message, "err"); 
  }
  
  btn.disabled = false;
  btn.textContent = "Simpan Penugasan";
};

/* ===== Boot ===== */
(async () => {
  // Pastikan tombol disabled saat pertama load sambil tunggu firebase
  $("btnSiswa").disabled = true;
  $("btnAdmin").disabled = true;
  
  await loadAll();
  
  const u = cache.users[sessionStorage.getItem("uid")];
  if (u) return start(u);
  
  if (!list("users").length) { 
    $("regHint").innerHTML = "<b>Belum ada akun di database.</b><br>Akun pertama yang mendaftar otomatis menjadi <b>Admin</b>."; 
    view(true); 
  }
})();
</script>
